[project]
name = "lights"
version = "0.1.0"
description = "B -> K(*) plus invisible analysis tools"
readme = "README.md"
authors = [
    { name = "Patrick Bolton", email = "patrick.d.bolton@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "iminuit>=2.33.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]
